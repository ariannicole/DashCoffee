<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DashCoffee - Coffee Shop Management System</title>
    <script>
        // Redirect to login or dashboard based on auth
        window.addEventListener('DOMContentLoaded', async () => {
            const user = localStorage.getItem('coffee_current_user');
            if (user) {
                window.location.href = 'dashboard.html';
            } else {
                window.location.href = 'login.html';
            }
        });
    </script>
</head>

<body
    style="background-color: #2c1810; display: flex; justify-content: center; align-items: center; height: 100vh; color: #f5f0eb; font-family: sans-serif;">
    <div style="text-align: center;">
        <h2>Loading DashCoffee System...</h2>
    </div>
</body>

</html>
